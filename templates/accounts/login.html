{% extends "base/shell.html" %}
{% block title %}Sign in · CTMS{% endblock %}
{% block content %}
<main class="grid min-h-screen place-items-center bg-slate-100 p-6">
  <form method="post" class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/50">
    {% csrf_token %}
    <div class="mb-7"><img src="/static/assets/chinar-logo.png" alt="Chinar Media Consulting Services Co." class="h-14 w-52 object-contain"></div>
    <h1 class="text-xl font-bold text-slate-900">Welcome back</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to your CTMS workspace.</p>
    {% if form.non_field_errors %}<p class="mt-4 rounded-lg bg-red-50 p-3 text-xs text-red-700">{{ form.non_field_errors }}</p>{% endif %}
    <label class="mt-6 block text-xs font-semibold text-slate-600">Employee ID / Email<input name="username" type="text" placeholder="Enter employee ID or email" autofocus required class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-500"></label>
    <label class="mt-4 block text-xs font-semibold text-slate-600">Password<input name="password" type="password" required class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-500"></label>
    <button class="mt-6 w-full rounded-lg bg-indigo-600 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20">Sign in</button>
  </form>
</main>
{% endblock %}
